name: publish-containers

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag / COSTRICT_VERSION (e.g. 24.04)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      TAG: ${{ inputs.tag }}
      COSTRICT_VERSION: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MY_SSH_PRIVATE_KEY }}

      - uses: ./.github/actions/setup-bun

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push containers
        run: bun ./packages/containers/script/build.ts --push
        env:
          REGISTRY: ghcr.io/zgsm-sangfor/costrict-cli
          TAG: ${{ env.TAG }}
