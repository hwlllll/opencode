services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      API_TOKEN: ${API_TOKEN:?API_TOKEN must be set}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      DATA_DIR: /data
      MAX_PACKAGE_BYTES: ${MAX_PACKAGE_BYTES:-2147483648}
    volumes:
      - data:/data
    restart: unless-stopped

volumes:
  data:
