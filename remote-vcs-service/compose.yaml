services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      API_TOKEN: ${API_TOKEN:-123456}
      DATA_DIR: /data
      MAX_PACKAGE_BYTES: ${MAX_PACKAGE_BYTES:-2147483648}
      CONFIG_PATH: /app/config.json
    volumes:
      - data:/data
      - ../packService/config.json:/app/config.json:ro
    restart: unless-stopped

volumes:
  data:
